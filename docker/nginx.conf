server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用没有前端路由，直接返回 index.html；文件不存在时也不猜测
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
